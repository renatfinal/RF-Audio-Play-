<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160f33"/>
      <stop offset="50%" stop-color="#5a189a"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Subtle glowing rings -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#00b4d8" stroke-width="5" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#9d4edd" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Text "RF" in bold white -->
  <text 
    x="256" 
    y="225" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="140" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="2"
  >RF</text>

  <!-- Text "Play" in bold white with cyan play arrow -->
  <g filter="url(#glow)">
    <text 
      x="240" 
      y="350" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="86" 
      font-weight="800" 
      fill="#ffffff" 
      text-anchor="middle"
      letter-spacing="3"
    >Play</text>
    <!-- Cyan play triangle accent -->
    <polygon points="325,315 325,338 344,326" fill="#00b4d8" />
  </g>
</svg>
